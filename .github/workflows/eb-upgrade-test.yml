name: EB upgrade test

on:
  push:
    branches:
      - test/eb-26.18-ci

env:
  BASE_REF: ff952e2312e191bcf0836210540ca03b169b80d3

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: shipped
            runner: ubuntu-24.04
            ref: base
          - variant: upgrade
            runner: ubuntu-latest
            ref: head
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref == 'base' && env.BASE_REF || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: "yarn"

      - uses: dtolnay/rust-toolchain@stable

      - name: Prerequisites
        run: |
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config curl zip unzip tar autoconf automake libtool gcc-mingw-w64-x86-64

      - run: yarn --frozen-lockfile

      - name: Build Linux
        run: |
          set +e
          yarn build:linux > "$RUNNER_TEMP/build.log" 2>&1
          code=$?
          grep -E "fpm|building|⨯" "$RUNNER_TEMP/build.log" | cut -c1-200
          exit $code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Asar sanity
        run: |
          (cd "$RUNNER_TEMP" && npm init -y > /dev/null && npm i @electron/asar@3.2.18 > /dev/null)
          NODE_PATH="$RUNNER_TEMP/node_modules" node -e "
          const asar=require('@electron/asar');
          const p='dist/linux-unpacked/resources/app.asar';
          for (const f of ['package.json','commitlint.config.js']) { try { const s=asar.extractFile(p,f).toString(); console.log(f, '=>', s.slice(0,60).replace(/\n/g,' ')); } catch (e) { console.log(f, 'not in asar'); } }
          console.log('build.log in asar:', asar.listPackage(p).some(x=>x.endsWith('build.log')));
          "
          ls -l dist

      - name: Pack unpacked dir
        run: tar -C dist -czf linux-unpacked.tgz linux-unpacked

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.variant }}
          path: |
            dist/*.rpm
            dist/*.deb
            dist/*.AppImage
            linux-unpacked.tgz
          compression-level: 0
          retention-days: 3

  install:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora:43
            kind: rpm
          - distro: opensuse/tumbleweed
            kind: rpm
          - distro: ubuntu:26.04
            kind: deb
          - distro: ubuntu:24.04
            kind: deb
          - distro: debian:13
            kind: deb
    runs-on: ubuntu-latest
    container: ${{ matrix.distro }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-upgrade
          path: up
      - uses: actions/download-artifact@v4
        with:
          name: linux-shipped
          path: sh

      - name: Install upgraded package and compare launch with shipped build
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${{ matrix.kind }}" = "rpm" ]; then
            f=$(find "$PWD/up" -name '*.rpm' | head -1)
            if command -v dnf; then dnf install -y "$f" xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon dbus-tools alsa-lib procps-ng which findutils tar gzip; else zypper --non-interactive --no-gpg-checks install --allow-unsigned-rpm "$f" xvfb-run dbus-1 libasound2 procps which findutils tar gzip; fi
            files=$(rpm -ql hydralauncher)
            rpm -q hydralauncher
          else
            export DEBIAN_FRONTEND=noninteractive
            f=$(find "$PWD/up" -name '*.deb' | head -1)
            apt-get update
            apt-get install -y "$f" xvfb xauth dbus procps tar gzip
            apt-get install -y libasound2t64 || apt-get install -y libasound2
            files=$(dpkg -L hydralauncher)
            dpkg -s hydralauncher | grep Version
          fi
          exe=$(echo "$files" | grep -E '^/opt/[^/]+/hydralauncher$')
          test -x "$exe"
          echo "$files" | grep -E '/usr/share/applications/.*\.desktop$'
          ls -l /usr/bin/hydralauncher "$(dirname "$exe")/chrome-sandbox"
          missing=$(ldd "$exe" | grep "not found" || true)
          echo "missing libs: ${missing:-none}"
          mkdir -p /t && tar -C /t -xzf "$(find sh -name linux-unpacked.tgz)"
          results=""
          for target in /t/linux-unpacked/hydralauncher "$exe"; do
            rm -rf /root/.config/hydralauncher /root/.config/Hydra
            set +e
            dbus-run-session -- xvfb-run -a timeout 30 "$target" --no-sandbox > launch.log 2>&1
            code=$?
            set -e
            echo "#### $target exit=$code (124 = still running after 30s)"
            grep -v -E "dbus|^$" launch.log | head -10
            results="$results $code"
          done
          echo "exit codes shipped/upgraded:$results"
          if [ "${{ matrix.kind }}" = "rpm" ]; then
            if command -v dnf; then dnf remove -y hydralauncher; else zypper --non-interactive remove hydralauncher; fi
          else
            apt-get remove -y hydralauncher
          fi
          test ! -e "$exe"
          test -z "$missing"
          test "$results" = " 124 124"

  appimage-launch:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-upgrade
          path: up
      - uses: actions/download-artifact@v4
        with:
          name: linux-shipped
          path: sh
      - name: Launch AppImages
        run: |
          sudo apt-get update && (sudo apt-get install -y xvfb libfuse2t64 || sudo apt-get install -y xvfb libfuse2)
          results=""
          for f in $(find "$PWD/sh" -name '*.AppImage') $(find "$PWD/up" -name '*.AppImage'); do
            chmod +x "$f"
            rm -rf ~/.config/hydralauncher ~/.config/Hydra
            set +e
            xvfb-run -a timeout 30 "$f" --no-sandbox > launch.log 2>&1
            code=$?
            set -e
            echo "#### $f exit=$code"
            grep -v -E "dbus|^$" launch.log | head -10
            results="$results $code"
          done
          echo "exit codes shipped/upgraded:$results"
          test "$results" = " 124 124"

  windows:
    strategy:
      fail-fast: false
      matrix:
        variant: [base, head]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.variant == 'base' && env.BASE_REF || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: "yarn"

      - uses: dtolnay/rust-toolchain@stable

      - run: yarn --frozen-lockfile

      - name: Build Windows
        run: yarn build:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Asar integrity
        shell: bash
        run: |
          ls -l dist
          node -e "
          const fs=require('fs'),crypto=require('crypto');
          const asar=require('@electron/asar');
          const s=fs.readFileSync('dist/win-unpacked/Hydra.exe').toString('latin1');
          const m=s.match(/\[\{\"file\":\"[^\]]*\"alg\":\"SHA256\"[^\]]*\]/g);
          const h=asar.getRawHeader('dist/win-unpacked/resources/app.asar');
          console.log('embedded', JSON.stringify(m));
          console.log('actual', crypto.createHash('sha256').update(h.headerString).digest('hex'));
          "

      - name: Launch helper
        shell: pwsh
        run: |
          @'
          param([string]$Exe, [string]$Tag)
          Get-Process Hydra -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item -Recurse -Force "$env:APPDATA\hydralauncher" -ErrorAction SilentlyContinue
          $p = Start-Process $Exe -PassThru
          $line = @()
          foreach ($i in 1..8) { Start-Sleep -Seconds 5; $line += "$($i*5)s:$(@(Get-Process Hydra -ErrorAction SilentlyContinue).Count)" }
          "#### $Tag hydra-process-count-over-time: $($line -join ' ') main_exited=$($p.HasExited)"
          $alive = @(Get-Process Hydra -ErrorAction SilentlyContinue).Count -gt 0
          Get-Process Hydra -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          if (-not $alive) { Get-ChildItem "$env:APPDATA\hydralauncher" -Recurse -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { "==== $($_.FullName)"; Get-Content $_.FullName -Tail 40 } }
          if (-not $alive) { throw "$Tag not running after 40s" }
          '@ | Set-Content launch.ps1

      - name: Launch win-unpacked
        shell: pwsh
        run: ./launch.ps1 -Exe "$PWD\dist\win-unpacked\Hydra.exe" -Tag unpacked

      - name: Install, compare, launch, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          $dir = "C:\HydraTest"
          $p = Start-Process $setup.FullName -ArgumentList "/S", "/D=$dir" -Wait -PassThru
          "installer exit: $($p.ExitCode)"
          $src = (Resolve-Path dist\win-unpacked).Path
          $bad = @()
          Get-ChildItem $src -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($src.Length + 1)
            $dst = Join-Path $dir $rel
            if (-not (Test-Path $dst)) { $bad += "missing $rel" }
            elseif ((Get-FileHash $_.FullName).Hash -ne (Get-FileHash $dst).Hash) { $bad += "differs $rel" }
          }
          "installed-vs-unpacked mismatches: $($bad.Count)"
          $bad | Select-Object -First 20
          ./launch.ps1 -Exe "$dir\Hydra.exe" -Tag installed
          $un = Get-ChildItem "$dir\Uninstall*.exe" | Select-Object -First 1
          $u = Start-Process $un.FullName -ArgumentList "/S" -Wait -PassThru
          Start-Sleep -Seconds 10
          "uninstaller exit: $($u.ExitCode); Hydra.exe still present: $(Test-Path "$dir\Hydra.exe")"
          if ($bad.Count -gt 0) { throw "installed files differ" }
          if (Test-Path "$dir\Hydra.exe") { throw "uninstall left files" }

      - name: Launch portable
        shell: pwsh
        run: |
          $port = Get-ChildItem dist\*-portable.exe | Select-Object -First 1
          ./launch.ps1 -Exe $port.FullName -Tag portable
