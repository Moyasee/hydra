name: EB upgrade test

on:
  push:
    branches:
      - test/eb-26.18-ci

permissions:
  actions: read
  contents: read

env:
  BASE_REF: ff952e2312e191bcf0836210540ca03b169b80d3
  FIRST_RUN: "44128364972"

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora:43
            kind: rpm
          - distro: opensuse/tumbleweed
            kind: rpm
          - distro: ubuntu:26.04
            kind: deb
          - distro: ubuntu:24.04
            kind: deb
          - distro: debian:13
            kind: deb
    runs-on: ubuntu-latest
    container: ${{ matrix.distro }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages-linux-upgrade
          path: pkgs
          run-id: ${{ env.FIRST_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install, check, launch, remove
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${{ matrix.kind }}" = "rpm" ]; then
            f=$(find "$PWD/pkgs" -name '*.rpm' | head -1)
            if command -v dnf; then dnf install -y "$f" xorg-x11-server-Xvfb xorg-x11-xauth procps-ng which findutils; else zypper --non-interactive --no-gpg-checks install --allow-unsigned-rpm "$f" xvfb-run procps which findutils; fi
            files=$(rpm -ql hydralauncher)
            rpm -q hydralauncher
          else
            export DEBIAN_FRONTEND=noninteractive
            f=$(find "$PWD/pkgs" -name '*.deb' | head -1)
            apt-get update
            apt-get install -y "$f" xvfb xauth procps
            files=$(dpkg -L hydralauncher)
            dpkg -s hydralauncher | grep Version
          fi
          exe=$(echo "$files" | grep -E '^/opt/[^/]+/hydralauncher$')
          test -x "$exe"
          echo "$files" | grep -E '/usr/share/applications/.*\.desktop$'
          cat $(echo "$files" | grep -E '/usr/share/applications/.*\.desktop$')
          echo "$files" | grep -E '/usr/share/icons/' | head -3
          ls -l /usr/bin/hydralauncher
          ls -l "$(dirname "$exe")/chrome-sandbox"
          missing=$(ldd "$exe" | grep "not found" || true)
          echo "missing libs: ${missing:-none}"
          test -z "$missing"
          set +e
          xvfb-run -a timeout 30 "$exe" --no-sandbox > launch.log 2>&1
          code=$?
          set -e
          tail -30 launch.log
          echo "launch exit code: $code (124 means still running after 30s)"
          test "$code" = "124"
          if [ "${{ matrix.kind }}" = "rpm" ]; then
            if command -v dnf; then dnf remove -y hydralauncher; else zypper --non-interactive remove hydralauncher; fi
          else
            apt-get remove -y hydralauncher
          fi
          test ! -e "$exe"

  appimage-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages-linux-upgrade
          path: pkgs
          run-id: ${{ env.FIRST_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Launch AppImage
        run: |
          sudo apt-get update && (sudo apt-get install -y xvfb libfuse2t64 || sudo apt-get install -y xvfb libfuse2)
          f=$(find "$PWD/pkgs" -name '*.AppImage' | head -1)
          chmod +x "$f"
          set +e
          xvfb-run -a timeout 30 "$f" --no-sandbox > launch.log 2>&1
          code=$?
          set -e
          tail -30 launch.log
          echo "launch exit code: $code"
          test "$code" = "124"

  fedora-local:
    strategy:
      fail-fast: false
      matrix:
        variant: [base, head]
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - name: Tools
        run: dnf install -y git nodejs22 nodejs22-npm rpm-build xz tar findutils libxcrypt-compat

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.variant == 'base' && env.BASE_REF || github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.variant == 'base' && 'unpacked-linux-shipped' || 'packages-linux-upgrade' }}
          path: art
          run-id: ${{ env.FIRST_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Local rpm + deb build on Fedora 43
        shell: bash
        run: |
          set -x
          rpm --version
          node --version
          mkdir -p dist && tar -C dist -xzf "$(find art -name linux-unpacked.tgz)"
          corepack enable || npm i -g yarn@1.22.22
          yarn --frozen-lockfile --ignore-scripts
          grep -v -E '^(beforePack|afterPack|afterSign):' electron-builder.yml > repack.yml
          npx electron-builder --version
          set +e
          npx electron-builder --config repack.yml --linux rpm deb --x64 --prepackaged dist/linux-unpacked --publish never 2>&1 | tee repack.log
          code=${PIPESTATUS[0]}
          set -e
          echo "electron-builder exit code: $code"
          ls -l dist/*.rpm dist/*.deb || true
          grep -n -E "rpmbuild|cannot execute|File not found" repack.log | head -5 || true
          if [ "${{ matrix.variant }}" = "head" ]; then test "$code" = "0"; else test "$code" != "0" && grep -q "rpmbuild failed" repack.log; fi

  windows:
    strategy:
      fail-fast: false
      matrix:
        variant: [base, head]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.variant == 'base' && env.BASE_REF || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: "yarn"

      - uses: dtolnay/rust-toolchain@stable

      - name: Check prebuilt torrent bridge
        run: node scripts/torrent-bridge-prebuilt.cjs check

      - run: yarn --frozen-lockfile

      - name: Build Windows
        shell: bash
        run: yarn build:win

      - name: Asar integrity
        shell: bash
        run: |
          node -e "
          const fs=require('fs'),crypto=require('crypto');
          const asar=require('@electron/asar');
          const s=fs.readFileSync('dist/win-unpacked/Hydra.exe').toString('latin1');
          const m=s.match(/\[\{\"file\":\"[^\]]*\"alg\":\"SHA256\"[^\]]*\]/g);
          const h=asar.getRawHeader('dist/win-unpacked/resources/app.asar');
          console.log('embedded', JSON.stringify(m));
          console.log('actual', crypto.createHash('sha256').update(h.headerString).digest('hex'));
          "

      - name: Launch diagnostics script
        shell: pwsh
        run: |
          @'
          param([string]$Exe, [string]$Tag)
          $out = "diag\$Tag"
          New-Item -ItemType Directory -Force $out | Out-Null
          Get-Process Hydra -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item -Recurse -Force "$env:APPDATA\hydralauncher" -ErrorAction SilentlyContinue
          $env:ELECTRON_ENABLE_LOGGING = "1"
          $env:ELECTRON_ENABLE_STACK_DUMPING = "1"
          $since = Get-Date
          $p = Start-Process $Exe -PassThru -RedirectStandardOutput "$out\stdout.txt" -RedirectStandardError "$out\stderr.txt"
          $timeline = @()
          foreach ($i in 1..8) {
            Start-Sleep -Seconds 5
            $procs = @(Get-Process Hydra -ErrorAction SilentlyContinue)
            $timeline += "t=$($i*5)s main_exited=$($p.HasExited) hydra_processes=$($procs.Count)"
          }
          $alive = -not $p.HasExited
          $exit = if ($p.HasExited) { $p.ExitCode } else { "running" }
          $timeline | Set-Content "$out\timeline.txt"
          "exit=$exit alive=$alive" | Add-Content "$out\timeline.txt"
          Get-Process Hydra -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Get-ChildItem "$env:APPDATA\hydralauncher" -Recurse -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { "==== $($_.FullName)"; Get-Content $_.FullName -Tail 80 } | Set-Content "$out\app-logs.txt"
          Get-WinEvent -FilterHashtable @{ LogName = "Application"; StartTime = $since } -ErrorAction SilentlyContinue | Where-Object { $_.LevelDisplayName -in "Error", "Critical" -or $_.ProviderName -like "*Windows Error Reporting*" } | Select-Object -First 10 | Format-List TimeCreated, ProviderName, Id, Message | Out-String -Width 300 | Set-Content "$out\events.txt"
          Write-Output "==== $Tag"
          Get-Content "$out\timeline.txt"
          Write-Output "---- stdout (tail)"; Get-Content "$out\stdout.txt" -Tail 40
          Write-Output "---- stderr (tail)"; Get-Content "$out\stderr.txt" -Tail 40
          Write-Output "---- app logs (tail)"; Get-Content "$out\app-logs.txt" -Tail 60
          Write-Output "---- events"; Get-Content "$out\events.txt"
          '@ | Set-Content launch-diag.ps1

      - name: Launch win-unpacked
        shell: pwsh
        run: ./launch-diag.ps1 -Exe "$PWD\dist\win-unpacked\Hydra.exe" -Tag unpacked

      - name: Install, compare, launch, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          $dir = "C:\HydraTest"
          $p = Start-Process $setup.FullName -ArgumentList "/S", "/D=$dir" -Wait -PassThru
          "installer exit: $($p.ExitCode)"
          $src = (Resolve-Path dist\win-unpacked).Path
          $bad = @()
          Get-ChildItem $src -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($src.Length + 1)
            $dst = Join-Path $dir $rel
            if (-not (Test-Path $dst)) { $bad += "missing $rel" }
            elseif ((Get-FileHash $_.FullName).Hash -ne (Get-FileHash $dst).Hash) { $bad += "differs $rel" }
          }
          "installed-vs-unpacked mismatches: $($bad.Count)"
          $bad | Select-Object -First 20
          ./launch-diag.ps1 -Exe "$dir\Hydra.exe" -Tag installed
          $un = Get-ChildItem "$dir\Uninstall*.exe" | Select-Object -First 1
          $u = Start-Process $un.FullName -ArgumentList "/S" -Wait -PassThru
          Start-Sleep -Seconds 10
          "uninstaller exit: $($u.ExitCode); Hydra.exe still present: $(Test-Path "$dir\Hydra.exe")"

      - name: Launch portable
        shell: pwsh
        run: |
          $port = Get-ChildItem dist\*-portable.exe | Select-Object -First 1
          ./launch-diag.ps1 -Exe $port.FullName -Tag portable

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-diag-${{ matrix.variant }}
          path: diag
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: matrix.variant == 'head'
        with:
          name: win-head-dist
          path: |
            dist/*-setup.exe
            dist/*-portable.exe
          compression-level: 0
          retention-days: 3
