name: EB upgrade test

on:
  workflow_dispatch:

env:
  BASE_REF: ff952e2312e191bcf0836210540ca03b169b80d3

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: shipped
            runner: ubuntu-24.04
            ref: base
          - variant: upgrade
            runner: ubuntu-latest
            ref: head
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref == 'base' && env.BASE_REF || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: "yarn"

      - uses: dtolnay/rust-toolchain@stable

      - name: Prerequisites
        run: |
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config curl zip unzip tar autoconf automake libtool gcc-mingw-w64-x86-64

      - run: yarn --frozen-lockfile

      - name: Build Linux
        run: |
          set +e
          yarn build:linux > "$RUNNER_TEMP/build.log" 2>&1
          code=$?
          grep -E "fpm|building|⨯" "$RUNNER_TEMP/build.log" | cut -c1-200
          exit $code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Asar sanity
        run: |
          (cd "$RUNNER_TEMP" && npm init -y > /dev/null && npm i @electron/asar@3.2.18 > /dev/null)
          NODE_PATH="$RUNNER_TEMP/node_modules" node -e "
          const asar=require('@electron/asar');
          const p='dist/linux-unpacked/resources/app.asar';
          for (const f of ['package.json','commitlint.config.js']) { try { const s=asar.extractFile(p,f).toString(); console.log(f, '=>', s.slice(0,60).replace(/\n/g,' ')); } catch (e) { console.log(f, 'not in asar'); } }
          console.log('build.log in asar:', asar.listPackage(p).some(x=>x.endsWith('build.log')));
          "
          ls -l dist

      - name: Pack unpacked dir
        run: tar -C dist -czf linux-unpacked.tgz linux-unpacked

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.variant }}
          path: |
            dist/*.rpm
            dist/*.deb
            dist/*.AppImage
            linux-unpacked.tgz
          compression-level: 0
          retention-days: 3

  install:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora:43
            kind: rpm
          - distro: opensuse/tumbleweed
            kind: rpm
          - distro: ubuntu:26.04
            kind: deb
          - distro: ubuntu:24.04
            kind: deb
          - distro: debian:13
            kind: deb
    runs-on: ubuntu-latest
    container: ${{ matrix.distro }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-upgrade
          path: up
      - uses: actions/download-artifact@v4
        with:
          name: linux-shipped
          path: sh

      - name: Install upgraded package and compare launch with shipped build
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${{ matrix.kind }}" = "rpm" ]; then
            f=$(find "$PWD/up" -name '*.rpm' | head -1)
            if command -v dnf; then dnf install -y "$f" xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon dbus-tools alsa-lib procps-ng which findutils tar gzip; else zypper --non-interactive --no-gpg-checks install --allow-unsigned-rpm "$f" xvfb-run dbus-1 libasound2 procps which findutils tar gzip; fi
            files=$(rpm -ql hydralauncher)
            rpm -q hydralauncher
          else
            export DEBIAN_FRONTEND=noninteractive
            f=$(find "$PWD/up" -name '*.deb' | head -1)
            apt-get update
            apt-get install -y "$f" xvfb xauth dbus procps tar gzip
            apt-get install -y libasound2t64 || apt-get install -y libasound2
            files=$(dpkg -L hydralauncher)
            dpkg -s hydralauncher | grep Version
          fi
          exe=$(echo "$files" | grep -E '^/opt/[^/]+/hydralauncher$')
          test -x "$exe"
          echo "$files" | grep -E '/usr/share/applications/.*\.desktop$'
          ls -l /usr/bin/hydralauncher "$(dirname "$exe")/chrome-sandbox"
          missing=$(ldd "$exe" | grep "not found" || true)
          echo "missing libs: ${missing:-none}"
          mkdir -p /t && tar -C /t -xzf "$(find sh -name linux-unpacked.tgz)"
          results=""
          for target in /t/linux-unpacked/hydralauncher "$exe"; do
            rm -rf /root/.config/hydralauncher /root/.config/Hydra
            set +e
            dbus-run-session -- xvfb-run -a timeout 30 "$target" --no-sandbox > launch.log 2>&1
            code=$?
            set -e
            echo "#### $target exit=$code (124 = still running after 30s)"
            grep -v -E "dbus|^$" launch.log | head -10
            results="$results $code"
          done
          echo "exit codes shipped/upgraded:$results"
          if [ "${{ matrix.kind }}" = "rpm" ]; then
            if command -v dnf; then dnf remove -y hydralauncher; else zypper --non-interactive remove hydralauncher; fi
          else
            apt-get remove -y hydralauncher
          fi
          test ! -e "$exe"
          test -z "$missing"
          test "$results" = " 124 124"

  appimage-launch:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-upgrade
          path: up
      - uses: actions/download-artifact@v4
        with:
          name: linux-shipped
          path: sh
      - name: Launch AppImages
        run: |
          sudo apt-get update && (sudo apt-get install -y xvfb libfuse2t64 || sudo apt-get install -y xvfb libfuse2)
          results=""
          for f in $(find "$PWD/sh" -name '*.AppImage') $(find "$PWD/up" -name '*.AppImage'); do
            chmod +x "$f"
            rm -rf ~/.config/hydralauncher ~/.config/Hydra
            set +e
            xvfb-run -a timeout 30 "$f" --no-sandbox > launch.log 2>&1
            code=$?
            set -e
            echo "#### $f exit=$code"
            grep -v -E "dbus|^$" launch.log | head -10
            results="$results $code"
          done
          echo "exit codes shipped/upgraded:$results"
          test "$results" = " 124 124"

