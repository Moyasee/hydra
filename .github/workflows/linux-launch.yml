name: Linux launch bisect

on:
  push:
    branches:
      - test/eb-26.18-ci

permissions:
  actions: read
  contents: read

env:
  FIRST_RUN: "44128364972"

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages-linux-upgrade
          path: up
          run-id: ${{ env.FIRST_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: unpacked-linux-shipped
          path: sh
          run-id: ${{ env.FIRST_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bisect
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          mkdir -p t/shipped t/upgrade
          tar -C t/shipped -xzf "$(find sh -name linux-unpacked.tgz)"
          tar -C t/upgrade -xzf "$(find up -name linux-unpacked.tgz)"
          S=t/shipped/linux-unpacked; U=t/upgrade/linux-unpacked
          CL=resources/app.asar.unpacked/node_modules/classic-level/build/Release/classic_level.node
          HN=resources/hydra-native/hydra-native.node
          mk() { rm -rf "t/$1"; cp -a "$2" "t/$1"; }
          mk s-asarU $S; cp $U/resources/app.asar t/s-asarU/resources/app.asar
          mk s-clU $S; cp $U/$CL t/s-clU/$CL
          mk s-hnU $S; cp $U/$HN t/s-hnU/$HN
          mk u-asarS $U; cp $S/resources/app.asar t/u-asarS/resources/app.asar
          mk u-clS $U; cp $S/$CL t/u-clS/$CL
          for d in shipped/linux-unpacked upgrade/linux-unpacked s-asarU s-clU s-hnU u-asarS u-clS; do
            rm -rf ~/.config/hydralauncher ~/.config/Hydra
            set +e
            ELECTRON_ENABLE_LOGGING=1 xvfb-run -a timeout 30 "$PWD/t/$d/hydralauncher" --no-sandbox > launch.log 2>&1
            code=$?
            set -e
            echo "################ $d exit=$code"
            grep -v -E "dbus|^$" launch.log | head -15
            for f in $(find ~/.config -name '*.log' 2>/dev/null); do echo "---- $f"; tail -25 "$f"; done
          done
